<!doctype html>
<style>html,body{margin:0;background:#eee}iframe{width:1100px;height:1050px;border:0;display:block}</style>
<iframe id="f" src="/"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w=this.contentWindow, d=this.contentDocument;
  d.documentElement.style.scrollBehavior='auto';
  d.querySelectorAll('.reveal').forEach(function(e){e.classList.add('visible');});
  setTimeout(function(){
    w.scrollTo(0, d.getElementById('portfolio').offsetTop - 20);
  }, 300);
});
</script>
